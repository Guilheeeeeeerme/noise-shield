openapi: 3.1.0
info:
  title: Noise Shield API
  version: 1.0.0
  description: |
    Backend API for Noise Shield MVP. Supports authentication, preference sync,
    feedback, consent, remote configuration, and opt-in anonymized acoustic features.
    Raw microphone audio is never accepted.
servers:
  - url: https://api.noise-shield.example/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: Auth
  - name: Preferences
  - name: Favorites
  - name: Consent
  - name: Feedback
  - name: Features
  - name: RemoteConfig
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/exchange:
    post:
      tags: [Auth]
      summary: Exchange provider identity token for Noise Shield session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthExchangeRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthExchangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthExchangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /preferences:
    get:
      tags: [Preferences]
      summary: List user preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preference map with server timestamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceListResponse'
    put:
      tags: [Preferences]
      summary: Upsert one or more preferences (LWW by server receipt time)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceUpsertRequest'
      responses:
        '200':
          description: Saved preferences with server_received_at
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceListResponse'

  /favorites:
    get:
      tags: [Favorites]
      summary: List favorite masking profiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Favorites ordered by sort_order
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FavoriteProfile'
    put:
      tags: [Favorites]
      summary: Replace or upsert favorites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/FavoriteProfileInput'
      responses:
        '200':
          description: Updated favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FavoriteProfile'

  /consent:
    get:
      tags: [Consent]
      summary: Get data collection consent state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
    put:
      tags: [Consent]
      summary: Update opt-in consent for anonymized acoustic features
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acoustic_features_opt_in, policy_version]
              properties:
                acoustic_features_opt_in:
                  type: boolean
                policy_version:
                  type: string
      responses:
        '200':
          description: Updated consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'

  /feedback/session:
    post:
      tags: [Feedback]
      summary: Submit session helpfulness feedback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFeedbackInput'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFeedback'

  /features/acoustic:
    post:
      tags: [Features]
      summary: Submit opt-in anonymized acoustic features (no raw audio)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcousticFeatureSubmission'
      responses:
        '201':
          description: Features stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '403':
          description: User has not opted in to feature collection

  /remote-config:
    get:
      tags: [RemoteConfig]
      summary: Fetch versioned remote configuration
      security:
        - bearerAuth: []
      parameters:
        - name: if-none-match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Remote configuration payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfiguration'
        '304':
          description: Not modified

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    AuthExchangeRequest:
      type: object
      required: [provider, id_token]
      properties:
        provider:
          type: string
          enum: [google, apple, facebook]
        id_token:
          type: string
        device_info:
          type: object
          additionalProperties: true

    AuthExchangeResponse:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, provider, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [google, apple, facebook]
        email:
          type: string
          format: email
          nullable: true
        display_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PreferenceEntry:
      type: object
      required: [key, value, server_received_at]
      properties:
        key:
          type: string
        value: {}
        server_received_at:
          type: string
          format: date-time

    PreferenceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceEntry'

    PreferenceUpsertRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value: {}
              client_updated_at:
                type: string
                format: date-time

    FavoriteProfile:
      type: object
      required: [sound_id, server_received_at]
      properties:
        sound_id:
          type: string
        label:
          type: string
          nullable: true
        sort_order:
          type: integer
        server_received_at:
          type: string
          format: date-time

    FavoriteProfileInput:
      type: object
      required: [sound_id]
      properties:
        sound_id:
          type: string
        label:
          type: string
        sort_order:
          type: integer

    ConsentRecord:
      type: object
      required: [acoustic_features_opt_in, policy_version, server_received_at]
      properties:
        acoustic_features_opt_in:
          type: boolean
        policy_version:
          type: string
        consented_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        server_received_at:
          type: string
          format: date-time

    SessionFeedbackInput:
      type: object
      required: [session_id, sound_id, helpful]
      properties:
        session_id:
          type: string
          format: uuid
        sound_id:
          type: string
        suggested_profile:
          type: string
          nullable: true
        helpful:
          type: boolean
        context:
          type: object
          additionalProperties: true

    SessionFeedback:
      allOf:
        - $ref: '#/components/schemas/SessionFeedbackInput'
        - type: object
          required: [id, submitted_at]
          properties:
            id:
              type: string
              format: uuid
            submitted_at:
              type: string
              format: date-time

    AcousticFeatureSubmission:
      type: object
      required: [session_id, feature_schema_version, features, captured_at]
      properties:
        session_id:
          type: string
          format: uuid
        feature_schema_version:
          type: string
          example: '1.0'
        broad_profile_label:
          type: string
          nullable: true
        features:
          type: object
          description: Derived numeric/bucket features only
          properties:
            rms_db:
              type: number
            level_bucket:
              type: string
              enum: [low, medium, high]
            band_energy_ratios:
              type: array
              items:
                type: number
          additionalProperties: false
        captured_at:
          type: string
          format: date-time

    RemoteConfiguration:
      type: object
      required: [version, payload, published_at]
      properties:
        version:
          type: integer
        payload:
          type: object
          properties:
            classifier_threshold:
              type: number
            auto_apply_debounce_ms:
              type: integer
            crossfade_ms:
              type: integer
            model_version:
              type: string
            experiments:
              type: object
              additionalProperties: true
        published_at:
          type: string
          format: date-time
