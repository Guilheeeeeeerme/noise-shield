services:
  postgres:
    image: postgres:16-alpine
    container_name: noise-shield-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: noise_shield
      POSTGRES_PASSWORD: noise_shield_dev
      POSTGRES_DB: noise_shield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noise_shield -d noise_shield']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
